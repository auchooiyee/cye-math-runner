<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CYE Math Runner — The Academy Run</title>
  <link rel="stylesheet" href="/src/ui/academy-shell.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body, #game-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #edf3f7;
      touch-action: none;
      user-select: none;
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <!-- Hidden preloader to force browser to cache glyphs before canvas render -->
  <div style="font-family: 'Orbitron'; position: absolute; left: -9999px; visibility: hidden;">0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
  <div style="font-family: 'Rajdhani'; position: absolute; left: -9999px; visibility: hidden;">0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
  <div style="font-family: 'Fira Code'; position: absolute; left: -9999px; visibility: hidden;">0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ+-=×÷┌┐└┘|</div>

  <div id="academy-loading" class="academy-loading" role="status" aria-label="Loading CYE Academy" style="position:fixed;inset:0;z-index:2000;background-color:#193f6c;display:grid;place-items:center">
    <div class="academy-loading-card">
      <div class="academy-loading-crest" aria-hidden="true">♛</div>
      <small>CYE ACADEMY</small><h1>Your next adventure</h1>
      <p>Getting the academy ready.<br>Learn. Practice. Run. Grow.</p>
      <progress id="academy-load-progress" max="1" value="0" aria-label="Loading progress"></progress>
      <span id="academy-load-status" class="academy-loading-status">Packing your school bag…</span>
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
